<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习通面板</title>
<link rel="icon" type="image/jpeg" href="/favicon.jpg">
<style>
  :root{
    --bg:#f2f4f7; --bg2:#e9edf2; --panel:#ffffff; --panel2:#f6f8fb; --line:#e5e9f0;
    --line2:#d4dae4; --txt:#2b3a4a; --txt2:#5e6d82; --dim:#8a97a8;
    --accent:#2f7de0; --accent2:#2566c4; --accent-soft:#e8f1fd;
    --ok:#1fa968; --warn:#f09b1c; --err:#ef5555;
    --r:10px; --r-sm:7px;
    --shadow:0 1px 2px rgba(30,60,120,.05), 0 6px 18px rgba(30,60,120,.07);
    --ring:0 0 0 3px rgba(47,125,224,.18);
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--txt);
       background:var(--bg);
       font:14px/1.6 Inter,"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif}
  ::selection{background:rgba(47,125,224,.18)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c6cfdb;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#aeb9c8}
  ::-webkit-scrollbar-track{background:transparent}

  /* 顶部超星蓝渐变条 */
  .topbar{height:3px;background:linear-gradient(90deg,#3d8bfd,#2f7de0 55%,#1f66d0);position:sticky;top:0;z-index:20}

  header{display:flex;align-items:center;gap:12px;padding:12px 22px;
         border-bottom:1px solid var(--line);
         background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
         position:sticky;top:3px;z-index:10}
  .logo{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
        background:linear-gradient(135deg,#3d8bfd,#2f7de0);color:#fff;font-weight:700;
        font-size:16px;flex:0 0 auto;box-shadow:0 2px 6px rgba(47,125,224,.28)}
  header h1{font-size:17px;margin:0;font-weight:600;color:var(--txt);letter-spacing:.01em}
  header h1 small{font-size:12px;color:var(--dim);font-weight:400;margin-left:8px}
  .page-nav{display:flex;gap:8px;margin-left:20px}
  .page-nav a{color:var(--txt2);text-decoration:none;padding:6px 14px;border-radius:18px}
  .page-nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .page-nav a:focus-visible{outline:none;box-shadow:var(--ring)}
  @media(max-width:750px){header{flex-wrap:wrap}.page-nav{margin-left:0}}
  .badge{font-size:12px;color:var(--dim)}

  main{padding:20px 22px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .card h2{font-size:14px;margin:0 0 14px;color:var(--txt);font-weight:600;
           display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:4px;height:16px;border-radius:2px;
                   background:linear-gradient(180deg,#3d8bfd,#2f7de0)}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);
        font-size:13px;vertical-align:middle}
  thead th{color:var(--txt2);font-weight:600;font-size:12px;background:var(--panel2)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--accent-soft)}
  .st{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500}
  .st-done{background:rgba(31,169,104,.12);color:#17894f}
  .st-todo{background:rgba(240,155,28,.14);color:#c77c08}
  .st-grade{background:rgba(47,125,224,.12);color:#2566c4}

  button{background:var(--panel);color:var(--txt);border:1px solid var(--line2);
         border-radius:var(--r-sm);padding:6px 14px;font-size:13px;cursor:pointer;
         font-family:inherit;line-height:1.5;
         transition:background .15s,border-color .15s,box-shadow .15s,color .15s,transform .06s}
  button:hover{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:none;box-shadow:var(--ring)}
  button.primary{background:linear-gradient(180deg,#3d8bfd,#2f7de0);border-color:var(--accent2);color:#fff}
  button.primary:hover{background:linear-gradient(180deg,#4d97ff,#2566c4);border-color:var(--accent2);color:#fff}
  button.danger{color:var(--err);border-color:#f3c2c2}
  button.danger:hover{background:#fdf0f0;border-color:var(--err);color:var(--err)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  label{display:block;font-size:12px;color:var(--txt2);margin-bottom:6px}
  .hint{font-size:12px;color:var(--dim);margin-top:10px}
  input,select{background:#fff;border:1px solid var(--line2);color:var(--txt);
               border-radius:var(--r-sm);padding:8px 11px;font-size:13px;width:100%;
               font-family:inherit;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  input::placeholder{color:#b6bfcc}

  #log{background:#f7f9fc;border:1px solid var(--line);border-radius:var(--r-sm);
       padding:12px 14px;height:240px;overflow:auto;
       font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:#43536a}

  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{padding:6px 18px;border-radius:20px;cursor:pointer;font-size:13px;
       border:1px solid var(--line2);background:var(--panel);color:var(--txt2);transition:.15s}
  .tab:hover{color:var(--accent);border-color:var(--accent)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .dot.run{background:var(--warn);animation:pulse 1s infinite}
  .dot.ok{background:var(--ok)} .dot.err{background:var(--err)}
  @keyframes pulse{50%{opacity:.3}}
  .nowrap{white-space:nowrap;display:flex;gap:6px;align-items:center}

</style>
<link rel="stylesheet" href="/study-assets/header.css">
</head>
<body>
<div class="topbar"></div>
<header>
  <div class="logo">学</div>
  <h1>学习通面板<small>超星学习通-看课自动化</small></h1>
  <nav class="page-nav" aria-label="页面导航"><a href="/" aria-current="page">作业面板</a><a href="/study">课程学习</a></nav>
  <span class="badge" id="statusBar">就绪</span>
  <span style="flex:1"></span>
  <button onclick="refreshWorks()">刷新列表</button>
  <button id="reloadPage" onclick="location.reload()">重载页面</button>
  <button id="openLlmSettings" onclick="openLlmSettings()">LLM 设置</button>
</header>

<main>
  <!-- 模型基准测试 -->
  <div class="card">
    <h2>模型基准测试（用已知答案打分，不保存不提交）</h2>
    <div class="grid">
      <div>
        <label>基准作业 workId</label>
        <input id="benchWork" value="57260630">
      </div>
      <div>
        <label>对比模型（逗号分隔）</label>
        <input id="benchModels" value="deepseek-chat,deepseek-reasoner">
      </div>
      <div style="display:flex;align-items:flex-end">
        <button class="primary" onclick="runBench()">开始对比</button>
      </div>
    </div>
    <div class="hint">
      默认用「党史章节测试 50 题」当基准（该份已确认满分）。结果会显示准确率、分题型正确率、错题明细。
    </div>
  </div>

  <!-- 作业 -->
  <div class="card">
    <div class="tabs">
      <button class="tab on" data-filter="todo" onclick="setFilter('todo',this)">未提交</button>
      <button class="tab" data-filter="all" onclick="setFilter('all',this)">全部</button>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button onclick="batch('resolve')">批量抓题</button>
      <button class="primary" onclick="batch('auto')">批量自动作答（暂存）</button>
      <button onclick="batch('verify')">批量核对</button>
      <span class="badge" id="selInfo">未选择</span>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:34px"><input type="checkbox" style="width:auto" onchange="toggleAll(this)"></th>
          <th>课程</th><th>作业</th><th>状态</th><th>题量</th><th>进度</th>
          <th style="width:290px">操作</th>
        </tr>
      </thead>
      <tbody id="worksBody"><tr><td colspan="7" class="badge">加载中…</td></tr></tbody>
    </table>
  </div>

  <!-- 日志 -->
  <div class="card">
    <h2>运行日志 <span id="jobState" class="badge"></span></h2>
    <div id="log">等待任务…</div>
  </div>
</main>
<dialog id="llmSettings" aria-labelledby="llmSettingsTitle">
  <div class="card">
    <div class="llm-heading"><h2 id="llmSettingsTitle">LLM 设置（自动作答用）</h2><button onclick="document.getElementById('llmSettings').close()">关闭</button></div>
    <div class="grid">
      <div>
        <label>API Base URL</label>
        <input id="cfgBase" placeholder="https://api.deepseek.com/v1">
      </div>
      <div>
        <label>模型</label>
        <input id="cfgModel" placeholder="deepseek-chat">
      </div>
      <div>
        <label>API Key <span id="keyState" class="badge"></span></label>
        <input id="cfgKey" type="password" placeholder="留空则不修改">
      </div>
      <div style="display:flex;align-items:flex-end;gap:10px">
        <button id="saveLlmSettings" class="primary" onclick="saveCfg()">保存设置</button>
        <button id="testLlmSettings" onclick="testLLM()">测试连接</button>
      </div>
    </div>
    <p id="llmNotice" class="notice" role="status"></p>
    <div class="hint">
      兼容 OpenAI 协议的都能用：DeepSeek / 通义 / Kimi / 本地 Ollama 等。
      默认只暂存不交卷。
    </div>
  </div>

</dialog>

<script src="/study-assets/llm-settings.js"></script>
<script>
let WORKS = [], FILTER = 'todo', CUR_JOB = null, POLL = null;

/* 访问口令：从 ?token=xxx 读取并记住（局域网模式才需要） */
const TOKEN = (() => {
  const q = new URLSearchParams(location.search).get('token');
  if(q){ localStorage.setItem('lxt_token', q); return q; }
  return localStorage.getItem('lxt_token') || '';
})();
function authHeaders(extra){
  const h = Object.assign({}, extra || {});
  if(TOKEN) h['X-Access-Token'] = TOKEN;
  return h;
}

async function api(path, opts){
  opts = opts || {};
  opts.headers = authHeaders(opts.headers);
  const r = await fetch(path, opts);
  if(!r.ok){
    let d = await r.text();
    throw new Error(d.slice(0,300));
  }
  return r.json();
}

function setStatus(t, cls){
  const s = document.getElementById('statusBar');
  s.innerHTML = (cls?`<span class="dot ${cls}"></span>`:'') + t;
}

function log(msg){
  const el = document.getElementById('log');
  if(el.dataset.init !== '1'){ el.textContent=''; el.dataset.init='1'; }
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

/* ---------- 作业列表 ---------- */
function stClass(s){
  if(s.includes('未提交')) return 'st-todo';
  if(s.includes('待批阅')) return 'st-grade';
  return 'st-done';
}

async function refreshWorks(){
  try{
    setStatus('刷新中…','run');
    const d = await api('/api/works?refresh=true');
    WORKS = d.works;
    renderWorks();
    setStatus(`共 ${d.count} 个作业`, 'ok');
  }catch(e){
    setStatus('刷新失败','err');
    log('❌ 刷新列表失败: '+e.message);
  }
}

function setFilter(f, btn){
  FILTER = f;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderWorks();
}

function toggleAll(cb){
  document.querySelectorAll('#worksBody input[type=checkbox]').forEach(x=>x.checked=cb.checked);
  updateSel();
}

function updateSel(){
  const n = document.querySelectorAll('#worksBody input[type=checkbox]:checked').length;
  document.getElementById('selInfo').textContent = n ? `已选 ${n} 份` : '未选择';
}

function renderWorks(){
  const tb = document.getElementById('worksBody');
  const list = WORKS.filter(w => FILTER==='all' || w.status.includes('未提交'));
  if(!list.length){
    tb.innerHTML = '<tr><td colspan="7" class="badge">没有符合条件的作业</td></tr>';
    return;
  }
  tb.innerHTML = list.map(w=>`
    <tr>
      <td><input type="checkbox" style="width:auto" value="${w.workId}" onchange="updateSel()"></td>
      <td>${esc(w.course)}</td>
      <td>${esc(w.title)}</td>
      <td><span class="st ${stClass(w.status)}">${esc(w.status)}</span></td>
      <td>${w.parsed ? '<span style="color:#17894f">已抓</span>' : '<span class="badge">—</span>'}</td>
      <td>${w.answered ? '已作答' : '<span class="badge">未作答</span>'}</td>
      <td class="nowrap">
        <button onclick="act('resolve','${w.workId}')">抓题</button>
        <button onclick="act('auto','${w.workId}')" class="primary">自动作答</button>
        <button onclick="showQ('${w.workId}')">看题</button>
        <button onclick="showA('${w.workId}')">看答案</button>
        <button onclick="act('submit','${w.workId}')" class="danger">交卷</button>
      </td>
    </tr>`).join('');
  updateSel();
}

function esc(s){ return (s||'').replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function selectedIds(){
  return [...document.querySelectorAll('#worksBody input[type=checkbox]:checked')]
         .map(x=>x.value);
}

/* ---------- 动作 ---------- */
async function act(action, wid, opts={}){
  const ids = opts.ids || [wid];
  try{
    setStatus(`${action} 运行中…`, 'run');
    log(`▶ ${action} ${ids.join(',')}`);
    const d = await api('/api/jobs', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action, workIds:ids, submit: !!opts.submit})
    });
    pollJob(d.jobId);
  }catch(e){
    setStatus('失败','err');
    log('❌ '+e.message);
  }
}

async function batch(action){
  const ids = selectedIds();
  if(!ids.length){ alert('先在表格里勾选作业'); return; }
  if(action==='submit' && !confirm(`确认交卷 ${ids.length} 份？交卷后无法修改。`)) return;
  act(action, null, {ids});
}

function pollJob(jid){
  if(POLL) clearInterval(POLL);
  CUR_JOB = jid;
  document.getElementById('jobState').innerHTML = '<span class="dot run"></span>运行中';
  let cursor = 0;

  POLL = setInterval(async ()=>{
    try{
      const j = await api('/api/jobs/'+jid);
      while(cursor < j.log.length){ log(j.log[cursor++]); }
      if(j.status !== 'running'){
        clearInterval(POLL); POLL=null;
        document.getElementById('jobState').innerHTML = j.status==='done'
          ? '<span class="dot ok"></span>完成'
          : '<span class="dot err"></span>出错';
        setStatus(j.status==='done' ? '完成' : '出错', j.status==='done'?'ok':'err');
        if(j.error) log('❌ '+j.error);
        if(j.status==='done') refreshWorks();
      }
    }catch(e){ /* 轮询失败忽略 */ }
  }, 900);
}

async function showQ(wid){
  try{
    const d = await api('/api/questions/'+wid);
    log(`—— ${wid} 共 ${d.count} 题 ——`);
    d.questions.forEach(q=>{
      log(`[${q.num}] ${q.type} #${q.qid}\n  ${q.stem.slice(0,120)}`);
      q.options.forEach(o=>log(`    ${o.data}  ${o.content.slice(0,70)}`));
    });
    log('（完整内容可在 API /api/questions/'+wid+' 取）');
  }catch(e){
    log('❌ '+e.message);
  }
}

async function showA(wid){
  try{
    const d = await api('/api/answers/'+wid);
    const n = Object.keys(d.answers).length;
    log(`—— ${wid} 共 ${n} 条答案 ——`);
    Object.entries(d.answers).forEach(([k,v])=>log(`  ${k} → ${v || '(空)'}`));
  }catch(e){
    log('❌ '+e.message);
  }
}

/* ---------- 基准测试 ---------- */
async function runBench(){
  const wid = document.getElementById('benchWork').value.trim();
  const models = document.getElementById('benchModels').value
                   .split(',').map(s=>s.trim()).filter(Boolean);
  log(`▶ 基准测试 ${wid}  模型: ${models.join(' / ')}`);
  setStatus('基准测试中…','run');
  try{
    const r = await fetch('/api/bench', {
      method:'POST', headers: authHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({workId: wid, models})
    });
    const d = await r.json();
    if(!r.ok){ throw new Error(d.detail || JSON.stringify(d)); }

    d.results.forEach(x=>{
      if(!x.ok){ log(`❌ ${x.model}: ${x.error}`); return; }
      log(`\n=== ${x.model} ===`);
      log(`准确率 ${x.accuracy}%  (${x.right}/${x.total})  耗时 ${x.latency}s`);
      log(`分题型: ${Object.entries(x.byType).map(([k,v])=>k+' '+v).join('  ')}`);
      if(x.wrongCount) log(`错 ${x.wrongCount} 题，前几道:`);
      x.wrong.forEach(w=>log(`   #${w.qid} [${w.type}] 正确=${w.want} 模型=${w.got}  ${w.stem}`));
    });
    setStatus('基准测试完成','ok');
  }catch(e){
    setStatus('基准测试失败','err');
    log('❌ '+e.message);
  }
}

/* ---------- 启动 ---------- */
(function init(){
  loadCfg().catch(()=>{});
  refreshWorks();
})();
</script>
</body>
</html>
